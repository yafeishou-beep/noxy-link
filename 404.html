<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<meta name=robots content="noindex,nofollow"><title>Noxy</title>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#070b12;color:#dce6f0;font:16px/1.5 Segoe UI,system-ui,sans-serif">
<p id=m style="max-width:420px;padding:24px;text-align:center">Opening Noxy...</p>
<script>
(function () {
  var base = '/noxy-link', m = document.getElementById('m');
  fetch(base + '/where.json?' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    var u = atob(j.w).replace(/\/+$/, ''), p = location.pathname;
    var rest = p.indexOf(base) === 0 ? p.slice(base.length) : '';
    if (rest === '/index.html' || rest === '/404.html') rest = '';
    location.replace(u + rest + location.search + location.hash);
  }).catch(function () { m.textContent = 'Noxy could not be reached just now. Try again in a minute.'; });
})();
</script>
